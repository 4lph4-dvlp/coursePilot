[project]
name = "coursepilot"
version = "0.1.0"
description = "University coursework scheduling and activity management assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.42.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "notion-client>=2.2.1",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "m3u8>=6.0.0",
    "cryptography>=50.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
coursepilot = "coursepilot.cli:main"
kau-assistant = "coursepilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coursepilot", "src/kau_assistant"]

[tool.hatch.build.targets.wheel.force-include]
"skills/coursepilot/SKILL.md" = "coursepilot/skill/SKILL.md"
"skills/coursepilot/JSON_CONTRACT.md" = "coursepilot/skill/JSON_CONTRACT.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
